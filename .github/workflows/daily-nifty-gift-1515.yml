name: Daily NIFTY GIFT 1515

on:
  schedule:
    - cron: "45 9 * * 1-5"   # 09:45 UTC (3:15 PM IST), Mon-Fri, same as Render
  workflow_dispatch:          # manual test runs

jobs:
  nifty-gift-snapshot-close:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # match what Render used
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NIFTY GIFT snapshot
        env:
          DATABASE_PROVIDER: ${{ secrets.DATABASE_PROVIDER }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          SUPABASE_CONN_STR: ${{ secrets.SUPABASE_CONN_STR }}
        run: python scripts/daily_NIFTY/daily_NIFTYGift_snapshot.py --mod...   # paste full command
