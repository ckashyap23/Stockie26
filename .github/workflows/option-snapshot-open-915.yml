name: Option Snapshot Open 915

on:
  schedule:
    - cron: "45 3 * * 1-5"   # 03:45 UTC (9:15 AM IST), Mon-Fri, same as Render
  workflow_dispatch:          # manual test runs

jobs:
  option-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # match what Render used
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run option snapshot
        env:
          DATABASE_PROVIDER: ${{ secrets.DATABASE_PROVIDER }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          SUPABASE_CONN_STR: ${{ secrets.SUPABASE_CONN_STR }}
        run: python scripts/daily_NIFTY/daily_NIFTYoption_snapshot.py   # add your flags here
