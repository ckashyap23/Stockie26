# NIFTY heavyweights - EDIT FREELY. Used only by the company-level seeds listed in `required_seeds`.
#
# A company-level headline (earnings, asset-quality event, large corporate action) only counts when its
# HEADLINE names one of the companies below (a name buried in the summary of a results roundup does not count), and its intensity is scaled by the stock's index weight:
#     weight_scale = min(1, weight_pct / full_weight_pct)
# so HDFC Bank (13%) counts in full and a 1% stock counts 0.2x.
#
# The weights are APPROXIMATE (drafted from memory of recent NIFTY 50 factsheets, not fetched from NSE).
# Please review and refresh them from the latest NSE factsheet. Constituents change rarely; weights drift.
as_of: "2025-draft"

# Seeds that need a named heavyweight. C03 (broad auto-sales / bank business updates) and C05 (already
# requires an Indian-company context) are deliberately not listed.
required_seeds: [C01, C02, C04, C07]

# Weight at (and above) which a company counts at full strength.
full_weight_pct: 5.0

heavyweights:
