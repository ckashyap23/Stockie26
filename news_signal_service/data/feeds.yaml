# Publishers and their feeds - the ONE place to add, remove or switch off a news source. EDIT FREELY.
# (/v1/sources is generated from this file; there is no separate registry any more.)
#
#   id        S-number, unique
#   priority  P1 | P2. P1 sources win when picking the representative headline of a duplicate cluster.
#   body      full     -> the article body may be fetched for matched events (per-site fetcher in extract.py)
#             headline -> paywalled: judged on headline/summary only, the body is never fetched
#   enabled   false    -> listed but not fetched (per publisher, or per feed)
#   access / rights / notes are for humans (rights and terms-of-use status).
#
# Probed 2026-11-09. Dropped after the probe (no usable public feed, 403/404, or licensed wire only):
#   NDTV Profit (403), Financial Express (feed unparseable - re-check), Informist, PTI, Reuters/AP direct
#   (no public RSS; Reuters/AP/WSJ headlines come via S11), Argus, S&P Global Energy, ET Now, WSJ direct (DNS).
publishers:
  - id: S01
    name: Economic Times
    geography: Domestic
    priority: P1
    body: full
    access: RSS
    rights: Terms restrict reuse; confirm permission
    notes: Markets + Economy feeds
    feeds:
      - {name: ET Markets, url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"}
      - {name: ET Economy, url: "https://economictimes.indiatimes.com/news/economy/rssfeeds/1373380680.cms"}
  - id: S02
    name: Mint
    geography: Domestic
    priority: P1
    body: full
    access: RSS
    rights: Confirm backend use
    notes: Markets + Economy feeds
    feeds:
